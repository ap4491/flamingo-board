<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flamingo Classic 2026-27 Draft Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ice:#EEF3F6;--board:#FFFFFF;--ink:#14202B;--muted:#5E6E7C;--line:#D3DDE4;--pink:#D9467A;--pinkbg:#FBE6EE;--blue:#2F5DA8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ice:#0E1620;--board:#16212D;--ink:#E6EEF4;--muted:#93A3B1;--line:#26333F;--pink:#F06B9A;--pinkbg:#3A1E2B;--blue:#7AA2E3}}
:root[data-theme="dark"]{--ice:#0E1620;--board:#16212D;--ink:#E6EEF4;--muted:#93A3B1;--line:#26333F;--pink:#F06B9A;--pinkbg:#3A1E2B;--blue:#7AA2E3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--ice);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.35}
.num,.cond{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ice);border-bottom:2px solid var(--blue);padding:10px 12px 8px}
.wrap{max-width:760px;margin:0 auto}
h1{margin:0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:26px;line-height:1;letter-spacing:.01em}
h1 span{color:var(--pink)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pick{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:16px;color:var(--muted);text-align:right}
.pick b{color:var(--ink)}
.slots{display:flex;gap:6px;margin:8px 0 6px}
.slot{flex:1;background:var(--board);border:1px solid var(--line);border-radius:6px;padding:4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.slot .cond{font-size:20px;font-weight:700}
.slot.full .cond{color:var(--pink)}
.slot small{color:var(--muted)}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--board);color:var(--ink);font:600 14px Barlow,sans-serif;padding:7px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
input[type=search],select{font:15px Barlow,sans-serif;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--board);color:var(--ink);min-width:0}
input[type=search]{flex:1 1 120px}
.tiny{border:1px solid var(--line);background:var(--board);color:var(--ink);font:500 13px Barlow,sans-serif;padding:6px 9px;border-radius:6px;cursor:pointer}
.best{margin-top:7px;font-size:14px;color:var(--muted)}
.best b{color:var(--ink)}
main{padding:6px 8px 40px}
.row{display:grid;grid-template-columns:34px 1fr auto auto;gap:8px;align-items:center;background:var(--board);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:7px 8px;margin:4px 0}
.row.F{border-left-color:var(--blue)}.row.D{border-left-color:#3E9C8F}.row.G{border-left-color:#C28A2C}
.row.taken{opacity:.38}
.row.mine{background:var(--pinkbg);border-color:var(--pink)}
.rk{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;text-align:right;color:var(--muted)}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:13px;color:var(--muted)}
.flag{display:inline-block;font-size:11px;font-weight:600;padding:0 5px;border-radius:4px;border:1px solid var(--pink);color:var(--pink);margin-left:4px}
.st{text-align:right;font-family:"Barlow Condensed",sans-serif;line-height:1.1}
.st .p{font-size:20px;font-weight:700}
.st .v{font-size:13px;color:var(--muted)}
.acts{display:flex;gap:4px}
.acts button{font:600 13px Barlow,sans-serif;border:1px solid var(--line);background:var(--ice);color:var(--ink);border-radius:5px;padding:7px 8px;cursor:pointer;min-width:48px}
.acts button.m{border-color:var(--pink);color:var(--pink)}
.row.taken .acts button,.row.mine .acts button{display:none}
.row.taken .acts .u,.row.mine .acts .u{display:inline-block}
.acts .u{display:none}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.team h2{font-family:"Barlow Condensed",sans-serif;font-size:20px;margin:14px 4px 4px}
.note{font-size:13px;color:var(--muted);margin:14px 4px;max-width:70ch}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pink);outline-offset:1px}
@media (max-width:420px){.acts button{min-width:44px;padding:7px 6px}.row{gap:6px}}
.sync{display:flex;gap:8px;align-items:center;margin-top:7px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:0 0 9px}
.dot.ok{background:#2E9E5B}.dot.err{background:var(--pink)}
.sync a{color:var(--blue);font-weight:600}
.sync input{width:84px;font:14px Barlow,sans-serif;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--board);color:var(--ink)}
.row.off{border-left-color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><h1>Flamingo Classic <span>draft board</span></h1><div class="pick" id="pick"></div></div>
  <div class="slots" id="slots"></div>
  <div class="ctrl">
    <div class="seg" id="posSeg">
      <button data-p="ALL" aria-pressed="true">All</button><button data-p="F">F</button><button data-p="D">D</button><button data-p="G">G</button><button data-p="MINE">My team</button>
    </div>
    <input type="search" id="q" placeholder="Search player or team">
  </div>
  <div class="ctrl" style="margin-top:6px">
    <label class="meta" for="slotSel">My slot</label>
    <select id="slotSel"></select>
    <button class="tiny" id="hideBtn">Show taken</button>
    <button class="tiny" id="undoBtn">Undo</button>
    <button class="tiny" id="resetBtn">Reset</button>
  </div>
  <div class="sync" id="sync"></div>
  <div class="best" id="best"></div>
</div></header>
<main><div class="wrap" id="list"></div></main>

  return Math.max(SY.count,local+SY.off.length)+1;
}
function myPicks(){const a=[];for(let r=1;r<=20;r++){const i=r%2?S.slot:TEAMS+1-S.slot;a.push((r-1)*TEAMS+i)}return a}

function header(){
  const c=counts(),cur=currentPick(),rd=Math.ceil(cur/TEAMS),nx=myPicks().find(p=>p>=cur);
  $('pick').innerHTML=cur>400?'Draft complete':`Pick <b>${cur}</b>, round ${rd}<br>${nx?(nx===cur?'<b style="color:var(--pink)">You are up</b>':`Your next: #${nx} (${nx-cur} away)`):''}`;
  $('slots').innerHTML=['F','D','G'].map(p=>`<div class="slot ${c[p]>=NEED[p]?'full':''}"><small>${p}</small><span class="cond">${c[p]}/${NEED[p]}</span></div>`).join('');
  const open=['F','D','G'].filter(p=>c[p]<NEED[p]);
  const b=DATA.find(x=>!status(x.n)&&open.includes(x.p));
  $('best').innerHTML=b?`Best available for your open slots: <b>${esc(b.n)}</b> (${b.p}, ${b.t}), value +${b.v}`:'';
  syncBar();
}
function syncBar(){
  const el=$('sync');
  if(!S.lk){
    el.innerHTML=`<span class="dot${SY.ok===false?' err':''}"></span><span>${SY.msg?esc(SY.msg):'Live sync off.'}</span><label for="lid">League ID</label><input id="lid" inputmode="numeric" value="${esc(S.lid)}"><button class="tiny" id="connBtn">${SY.busy?'Connecting':'Connect Yahoo'}</button>${SY.ok===false?'<a href="/.netlify/functions/draft-auth">Sign in to Yahoo again</a>':''}`;
    $('connBtn').onclick=()=>{S.lid=$('lid').value.trim();S.want=true;save();runSetup()};
    return;
  }
  const ago=SY.at?Math.round((Date.now()-SY.at)/1000):null;
  const txt=SY.ok===false?esc(SY.msg):`Live from Yahoo${S.lname?' ('+esc(S.lname)+')':''}: ${SY.count} picks${ago!=null?`, updated ${ago}s ago`:''}${SY.off.length?`, ${SY.off.length} not on board`:''}.${esc(SY.warn)}`;
  el.innerHTML=`<span class="dot ${SY.ok===false?'err':S.live&&SY.ok?'ok':''}"></span><span>${S.live?txt:'Sync paused.'}</span><button class="tiny" id="liveBtn">${S.live?'Pause':'Resume'}</button><button class="tiny" id="discBtn">Disconnect</button>`;
  $('liveBtn').onclick=()=>{S.live=!S.live;save();if(S.live)poll();header()};
  $('discBtn').onclick=()=>{S.lk=S.tk=S.lname=null;S.want=false;SY={map:{},off:[],count:0,ok:null,msg:'',warn:'',at:0,busy:false};save();render()};
}

function row(x){
  const s=status(x.n),syn=!!SY.map[x.n];
  const cls=`row ${x.p}${s==='t'?' taken':''}${s==='m'?' mine':''}`;
  const fl=x.f?`<span class="flag">${x.f==='SPLIT'?'Split job':x.f==='SUSP'?'Suspended':'Injured'}</span>`:'';
  const meta=x.p==='G'?`${x.t} G${x.pr}, ${x.w} W, ${x.so} SO`:`${x.t} ${x.p}${x.pr}`;
  const undo=syn?'':`<button class="u" aria-label="Undo ${esc(x.n)}">Undo</button>`;
  return `<div class="${cls}" data-n="${esc(x.n)}"><div class="rk">${x.r}</div><div style="min-width:0"><div class="nm">${esc(x.n)}${fl}</div><div class="meta">${meta}</div></div><div class="st"><div class="p">${x.pts}</div><div class="v">+${x.v}</div></div><div class="acts"><button class="t" aria-label="Mark ${esc(x.n)} taken">Taken</button><button class="m" aria-label="Draft ${esc(x.n)} to my team">Mine</button>${undo}</div></div>`;
}
function offRow(o){
  return `<div class="row off mine"><div class="rk">-</div><div style="min-width:0"><div class="nm">${esc(o.n)}</div><div class="meta">${esc(o.team)} ${esc(o.pos)}, not on board</div></div><div class="st"><div class="p">-</div></div><div class="acts"></div></div>`;
}
const NOTE=`<p class="note">Rank is by value over replacement: projected points minus the last starter drafted at that position (240th F = 40, 120th D = 27, 40th G = 37). Skater points are NHL.com 2026-27 projections (goals + assists). Goalie points are projected wins x2 plus estimated shutouts x2 (9% of wins). Beyond this list, defencemen 97-120 are unranked; take the best available D with a top-4 or power-play role.</p>`;

function render(){
  header();
  const q=$('q').value.trim().toLowerCase();
  document.querySelectorAll('#posSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===S.pos));
  $('hideBtn').textContent=S.hide?'Show taken':'Hide taken';
  $('slotSel').value=S.slot;
  if(S.pos==='MINE'){
    const mine=DATA.filter(x=>status(x.n)==='m');let h='',tot=0;
    ['F','D','G'].forEach(p=>{
      const a=mine.filter(x=>x.p===p),off=SY.off.filter(o=>o.mine&&o.p===p);
      const t=a.reduce((s,x)=>s+x.pts,0);tot+=t;
      h+=`<div class="team"><h2>${p==='F'?'Forwards':p==='D'?'Defence':'Goalies'} ${a.length+off.length}/${NEED[p]}, ${Math.round(t)} pts</h2>${a.map(row).join('')}${off.map(offRow).join('')}${a.length+off.length?'':'<div class="empty">None yet</div>'}</div>`;
    });
    h+=`<p class="note">Projected team total: <b>${Math.round(tot)}</b> fantasy points (players not on the board count as 0).</p>`;
    $('list').innerHTML=h;return;
  }
  const a=DATA.filter(x=>{const s=status(x.n);return (S.pos==='ALL'||x.p===S.pos)&&(!S.hide||!s||s==='m')&&(!q||x.n.toLowerCase().includes(q)||x.t.toLowerCase()===q)});
  $('list').innerHTML=a.length?a.map(row).join('')+NOTE:'<div class="empty">No players match. Clear the search or switch position.</div>';
}

/* ---------- Yahoo sync ---------- */
async function api(qs){
  const r=await fetch(`${FN}?${qs}`,{credentials:'same-origin',cache:'no-store'});
  const j=await r.json().catch(()=>({error:`HTTP ${r.status}`}));
  if(r.status===401)throw Object.assign(new Error('auth'),{auth:true});
  if(!r.ok)throw Object.assign(new Error(j.error||`HTTP ${r.status}`),{data:j});
  return j;
}
async function runSetup(){
  SY.busy=true;SY.msg='Connecting to Yahoo';header();
  try{
    const j=await api(`op=setup&league_id=${encodeURIComponent(S.lid)}`);
    S.lk=j.league_key;S.tk=j.team_key;S.lname=j.league_name;S.want=false;save();
    SY.ok=true;SY.msg='';SY.warn=j.team_key?'':' No team of yours found in this league, so your picks sync as Taken. Use Mine manually.';
    await poll();
  }catch(e){
    if(e.auth){location.href='/.netlify/functions/draft-auth';return}
    SY.ok=false;SY.msg=e.message+(e.data&&e.data.leagues&&e.data.leagues.length?` Your NHL leagues: ${e.data.leagues.map(l=>l.id+' '+l.name).join(', ')}`:'');
  }finally{SY.busy=false;render()}
}
let polling=false;
async function poll(){
  if(!S.lk||polling)return;polling=true;
  try{
    const {picks}=await api(`op=draft&lk=${encodeURIComponent(S.lk)}`);
    const done=picks.filter(p=>p.player_key);
    const need=[...new Set(done.map(p=>p.player_key).filter(k=>!NAMES[k]))];
    for(let i=0;i<need.length;i+=25){
      const {players}=await api(`op=players&lk=${encodeURIComponent(S.lk)}&keys=${need.slice(i,i+25).join(',')}`);
      players.forEach(p=>{NAMES[p.player_key]={n:p.name,pos:p.pos,team:p.team}});
    }
    if(need.length)saveNames();
    const map={},off=[];
    done.forEach(p=>{
      const info=NAMES[p.player_key];if(!info)return;
      const mine=!!S.tk&&p.team_key===S.tk;
      const bn=matchName(info.n);
      if(bn){if(map[bn]!=='m')map[bn]=mine?'m':'t'}
      else off.push({n:info.n,pos:info.pos,team:info.team,p:posOf(info.pos),mine});
    });
    if(S.tk){const r1=picks.find(p=>p.round===1&&p.team_key===S.tk);if(r1&&r1.pick>=1&&r1.pick<=TEAMS&&S.slot!==r1.pick){S.slot=r1.pick;save()}}
    SY.map=map;SY.off=off;SY.count=done.length;SY.at=Date.now();
    SY.ok=true;SY.msg='';
  }catch(e){
    SY.ok=false;SY.msg=e.auth?'Yahoo sign-in expired. Tap Disconnect, then Connect Yahoo.':`Sync error: ${e.message}. Retrying.`;
  }finally{polling=false;render()}
}
setInterval(()=>{if(S.lk&&S.live&&!document.hidden)poll();else if(S.lk)syncBar()},6000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.lk&&S.live)poll()});

/* ---------- manual controls ---------- */
$('list').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const r=b.closest('.row');if(!r||!r.dataset.n)return;const n=r.dataset.n;
  if(b.classList.contains('u')){delete S.st[n];S.hist=S.hist.filter(h=>h!==n)}
  else{S.st[n]=b.classList.contains('m')?'m':'t';S.hist.push(n)}
  save();render();
});
$('posSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.pos=b.dataset.p;save();render();window.scrollTo(0,0)});
$('q').addEventListener('input',render);
$('hideBtn').onclick=()=>{S.hide=!S.hide;save();render()};
$('undoBtn').onclick=()=>{const n=S.hist.pop();if(n)delete S.st[n];save();render()};
$('resetBtn').onclick=()=>{if(confirm('Clear all manual picks? Synced Yahoo picks will reload.')){S.st={};S.hist=[];save();render()}};
const sel=$('slotSel');for(let i=1;i<=20;i++)sel.add(new Option(i,i));sel.onchange=()=>{S.slot=+sel.value;save();render()};

render();
if(S.lk)poll();else if(S.want)runSetup();
</script>
</body>
</html>
